[project]
name = "pdf-llm-ocr"
version = "0.1.0"
description = "PDF-Service: Vision-LLM-OCR mit lagegetreuem, unsichtbarem Textlayer im Ergebnis-PDF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "pypdf>=5.0",
    "reportlab>=4.2",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_llm_ocr = ["prompts/*.txt", "static/*"]
